[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-copilot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "google-genai>=2.25,<3",
    "typesafe-sdk>=0.7.2,<1",
]

[project.optional-dependencies]
claude = [
    "anthropic>=1.9,<2",
]
dev = [
    "pytest>=8,<9",
    "httpx>=0.27,<1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
