<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Research Copilot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f5f2; --surface: #ffffff; --surface-2: #efede8; --text: #1c1b19;
    --muted: #6d6b64; --border: #e3e0d8; --accent: #3b5bdb; --accent-soft: #e8edff;
    --user-bubble: #1c1b19; --user-text: #ffffff;
    --ok: #1f7a4d; --ok-soft: #e3f4ea; --warn: #8a5300; --warn-soft: #fbf0dc;
    --bad: #a8321f; --bad-soft: #fbe6e1;
    --shadow: 0 1px 2px rgba(20, 18, 12, .04), 0 4px 16px rgba(20, 18, 12, .05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #131312; --surface: #1c1c1a; --surface-2: #252522; --text: #ecebe5;
      --muted: #9d9b93; --border: #302f2b; --accent: #8aa2ff; --accent-soft: #232a45;
      --user-bubble: #ecebe5; --user-text: #131312;
      --ok: #6fcf9a; --ok-soft: #173024; --warn: #e6b25c; --warn-soft: #33270f;
      --bad: #f19483; --bad-soft: #3a1f19;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.6 "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    border-bottom: 1px solid var(--border); background: var(--bg);
    padding: 14px 16px; position: sticky; top: 0; z-index: 2;
  }
  .bar { max-width: 780px; margin: 0 auto; display: flex; align-items: center; gap: 10px; }
  .logo {
    width: 28px; height: 28px; border-radius: 8px; background: var(--accent);
    display: grid; place-items: center; color: #fff; font-weight: 600; font-size: 14px;
  }
  header h1 { font-size: 16px; font-weight: 600; margin: 0; }
  header .tag { margin-left: auto; font-size: 13px; color: var(--muted); }

  #thread { flex: 1; overflow-y: auto; padding: 24px 16px 16px; }
  .inner { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

  .empty { text-align: center; padding: 8vh 0 0; }
  .empty h2 { font-size: 26px; font-weight: 600; margin: 0 0 6px; letter-spacing: -.01em; }
  .empty p { color: var(--muted); margin: 0 0 26px; }
  .suggestions { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; text-align: left; }
  .suggestions button {
    font: inherit; text-align: left; cursor: pointer; color: var(--text);
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 14px; box-shadow: var(--shadow); transition: border-color .15s, transform .15s;
  }
  .suggestions button:hover { border-color: var(--accent); transform: translateY(-1px); }
  .suggestions small { display: block; color: var(--muted); font-size: 12px; margin-bottom: 2px; }

  .msg { display: flex; }
  .msg.user { justify-content: flex-end; }
  .msg.user .bubble {
    background: var(--user-bubble); color: var(--user-text); border-radius: 16px 16px 4px 16px;
    padding: 10px 14px; max-width: 80%; white-space: pre-wrap; word-wrap: break-word;
  }
  .msg.bot .bubble {
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px 16px 16px 4px;
    padding: 14px 16px; max-width: 100%; width: 100%; box-shadow: var(--shadow);
  }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600;
    padding: 2px 10px; border-radius: 999px; margin-bottom: 8px;
  }
  .chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .chip.answered { color: var(--ok); background: var(--ok-soft); }
  .chip.partial, .chip.evidence_only { color: var(--warn); background: var(--warn-soft); }
  .chip.insufficient_evidence, .chip.error { color: var(--bad); background: var(--bad-soft); }
  .answer { white-space: pre-wrap; margin: 0; }
  .limits { margin: 10px 0 0; padding: 8px 12px; border-radius: 8px; background: var(--surface-2); color: var(--muted); font-size: 13px; }

  details { margin-top: 12px; border-top: 1px solid var(--border); padding-top: 10px; }
  summary { cursor: pointer; font-size: 13px; font-weight: 600; color: var(--muted); list-style: none; }
  summary::-webkit-details-marker { display: none; }
  summary::before { content: "▸ "; }
  details[open] summary::before { content: "▾ "; }
  .sources { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .source { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; background: var(--bg); }
  .source .meta { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .source .meta strong { color: var(--text); font-weight: 600; }
  .source .who { padding: 1px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .source .id { margin-left: auto; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; }
  .source blockquote { margin: 0; font-size: 14px; border-left: 3px solid var(--accent); padding-left: 10px; }

  .typing { display: inline-flex; gap: 4px; align-items: center; color: var(--muted); font-size: 13px; }
  .typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite; }
  .typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
  .typing span { margin-left: 6px; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

  footer { padding: 12px 16px calc(14px + env(safe-area-inset-bottom)); background: linear-gradient(transparent, var(--bg) 30%); }
  .composer {
    max-width: 780px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end;
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    padding: 8px 8px 8px 14px; box-shadow: var(--shadow);
  }
  .composer:focus-within { border-color: var(--accent); }
  textarea {
    flex: 1; border: 0; outline: 0; resize: none; background: transparent; color: var(--text);
    font: inherit; max-height: 180px; padding: 6px 0; line-height: 1.5;
  }
  .send {
    width: 38px; height: 38px; border: 0; border-radius: 10px; cursor: pointer; flex: none;
    background: var(--accent); color: #fff; display: grid; place-items: center;
  }
  .send:disabled { opacity: .4; cursor: default; }
  .hint { max-width: 780px; margin: 6px auto 0; text-align: center; font-size: 12px; color: var(--muted); }
  @media (max-width: 560px) { .msg.user .bubble { max-width: 90%; } header .tag { display: none; } }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="logo" aria-hidden="true">R</div>
    <h1>Research Copilot</h1>
    <span class="tag">Answers grounded in your UX research</span>
  </div>
</header>

<main id="thread" aria-live="polite">
  <div class="inner" id="messages">
    <div class="empty" id="empty">
      <h2>What do you want to know?</h2>
      <p>Ask about the research. Every answer cites the studies and quotes it comes from.</p>
      <div class="suggestions">
        <button type="button"><small>Findings</small>Why do users abandon checkout?</button>
        <button type="button"><small>Check a hypothesis</small>Did people find checkout frustrating?</button>
        <button type="button"><small>Catalog</small>Which studies covered payments?</button>
        <button type="button"><small>Out of scope</small>What do users think about dark mode?</button>
      </div>
    </div>
  </div>
</main>

<footer>
  <form class="composer" id="composer">
    <label for="input" class="sr-only" style="position:absolute;left:-9999px">Ask a question</label>
    <textarea id="input" rows="1" maxlength="2000" placeholder="Ask a question about the research…"></textarea>
    <button class="send" id="send" type="submit" aria-label="Send" disabled>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    </button>
  </form>
  <p class="hint">Each question is answered on its own from the research corpus. Enter to send, Shift+Enter for a new line.</p>
</footer>

<script>
  const STATUS = {
    answered: "Answered",
    partial: "Partly answered",
    insufficient_evidence: "Not enough evidence",
    evidence_only: "Evidence only, no summary",
    error: "Something went wrong",
  };
  const thread = document.getElementById("thread");
  const messages = document.getElementById("messages");
  const empty = document.getElementById("empty");
  const composer = document.getElementById("composer");
  const input = document.getElementById("input");
  const send = document.getElementById("send");
  let busy = false;

  function el(tag, props = {}, children = []) {
    const node = Object.assign(document.createElement(tag), props);
    for (const child of children) node.append(child);
    return node;
  }

  function scrollDown() { thread.scrollTo({ top: thread.scrollHeight, behavior: "smooth" }); }

  function addMessage(role, content) {
    empty.remove();
    const bubble = el("div", { className: "bubble" }, content);
    messages.append(el("div", { className: `msg ${role}` }, [bubble]));
    scrollDown();
    return bubble;
  }

  function sourceCard(source) {
    const who = source.kind === "quote" ? source.speaker
      : source.kind === "document" ? "Study" : "Researcher";
    const card = el("div", { className: "source" }, [
      el("div", { className: "meta" }, [
        el("span", { className: "who", textContent: who }),
        el("strong", { textContent: source.title }),
        el("span", { className: "id", textContent: source.chunk_id }),
      ]),
    ]);
    if (source.quote) card.append(el("blockquote", { textContent: source.quote }));
    return card;
  }

  function renderAnswer(bubble, data) {
    const status = data.status in STATUS ? data.status : "error";
    const parts = [
      el("span", { className: `chip ${status}`, textContent: STATUS[status] }),
      el("p", { className: "answer", textContent: data.answer || "" }),
    ];
    for (const note of data.limitations || []) parts.push(el("div", { className: "limits", textContent: note }));
    const sources = data.sources || [];
    if (sources.length) {
      const details = el("details", {}, [
        el("summary", { textContent: `${sources.length} source${sources.length === 1 ? "" : "s"}` }),
        el("div", { className: "sources" }, sources.map(sourceCard)),
      ]);
      // Evidence-only answers are nothing but sources, so show them straight away.
      if (status === "evidence_only") details.open = true;
      parts.push(details);
    }
    bubble.replaceChildren(...parts);
    scrollDown();
  }

  async function ask(question) {
    if (busy || !question.trim()) return;
    busy = true;
    send.disabled = true;
    addMessage("user", [question.trim()]);
    const bubble = addMessage("bot", [
      el("span", { className: "typing" }, [el("i"), el("i"), el("i"), el("span", { textContent: "Searching the research…" })]),
    ]);
    try {
      const response = await fetch("/ask", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ question: question.trim() }),
      });
      if (!response.ok) throw new Error(`The server returned ${response.status}. Please try again.`);
      renderAnswer(bubble, await response.json());
    } catch (error) {
      renderAnswer(bubble, { status: "error", answer: error.message });
    } finally {
      busy = false;
      send.disabled = !input.value.trim();
      input.focus();
    }
  }

  function autosize() {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 180) + "px";
    send.disabled = busy || !input.value.trim();
  }

  input.addEventListener("input", autosize);
  input.addEventListener("keydown", (event) => {
    if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
      event.preventDefault();
      composer.requestSubmit();
    }
  });
  composer.addEventListener("submit", (event) => {
    event.preventDefault();
    const question = input.value;
    input.value = "";
    autosize();
    ask(question);
  });
  document.querySelectorAll(".suggestions button").forEach((button) =>
    button.addEventListener("click", () => ask(button.lastChild.textContent)));
  input.focus();
</script>
</body>
</html>
